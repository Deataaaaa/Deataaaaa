name: iOS

on:
  push:
    branches: ["claude/**", main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et compilation
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Sélectionner le Xcode le plus récent
        run: |
          set -euo pipefail
          # Le runner embarque plusieurs versions : on prend la plus haute
          # plutôt qu'un chemin figé qui casserait à chaque mise à jour d'image.
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode retenu : $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version
          echo "--- SDK iOS disponibles ---"
          xcodebuild -showsdks | grep -i iphone || true

      - name: Tests du coeur métier
        working-directory: ios/Packages/PeculeCore
        run: swift test --verbose

      - name: Compilation de l'application
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Pecule.xcodeproj \
            -scheme Pecule \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
