<script type="module">
  const ep = new URLSearchParams(location.search).get('ep') || 'ep01';
  const mod = await import(`/episodes/${ep}.js`);
  await document.fonts.load('60px "Instrument Serif"');
  await document.fonts.load('italic 60px "Instrument Serif"');
  await document.fonts.load('500 20px "JetBrains Mono"');
  await document.fonts.load('400 20px "JetBrains Mono"');
  const app = await mod.create();
  window.META = { duration: app.duration, fps: app.fps || 30, cues: app.cues || [] };
  window.renderFrame = (t, opts) => { app.frame(t, opts || {}); return true; };
  window.ready = true;
